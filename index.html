<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Owino Live</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #09090f;
      color: white;
    }

    header {
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #11111a;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      color: #ff3b81;
    }

    .buttons a {
      text-decoration: none;
      margin-left: 8px;
      padding: 10px 15px;
      border-radius: 8px;
      color: white;
      background: #ff3b81;
      font-size: 14px;
    }

    .hero {
      text-align: center;
      padding: 80px 20px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero p {
      color: #bbb;
      font-size: 18px;
      margin-bottom: 30px;
    }

    .start-btn {
      display: inline-block;
      padding: 15px 30px;
      background: #ff3b81;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }

    .section {
      padding: 30px 20px;
      max-width: 1000px;
      margin: auto;
    }

    .section h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .card {
      background: #151520;
      padding: 30px 20px;
      border-radius: 12px;
      text-align: center;
    }

    footer {
      margin-top: 50px;
      padding: 35px 20px;
      text-align: center;
      background: #11111a;
      color: #888;
    }
  </style>
</head>

<body>

  <header>

    <div class="logo">
      Owino Live
    </div>

    <div class="buttons">
      <a href="login.html">Log In</a>
      <a href="signup.html">Sign Up</a>
    </div>

  </header>

  <section class="hero">

    <h1>Welcome to Owino Live</h1>

    <p>
      Watch live streams, meet new people and enjoy live entertainment.
    </p>

    <a class="start-btn" href="signup.html">
      Get Started
    </a>

  </section>

  <section class="section">

    <h2>Live Now</h2>

    <div class="cards">

      <div class="card">
        🔴<br><br>
        Live Stream
      </div>

      <div class="card">
        🔴<br><br>
        Live Stream
      </div>

      <div class="card">
        🔴<br><br>
        Live Stream
      </div>

    </div>

  </section>

  <footer>

    <strong>Owino Live</strong>

    <p>
      © 2026 Owino Live. All rights reserved.
    </p>

  </footer>

</body>
</html>
