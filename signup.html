<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Owino Live</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #09090f;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: #151520;
      padding: 30px;
      border-radius: 15px;
    }

    h1 {
      text-align: center;
      color: #ff3b81;
    }

    h2 {
      text-align: center;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #09090f;
      color: white;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: none;
      border-radius: 8px;
      background: #ff3b81;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #message {
      text-align: center;
      margin-top: 15px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #ff3b81;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>Owino Live</h1>

    <h2>Create Account</h2>

    <form id="signupForm">

      <label>Username</label>
      <input id="username" type="text"
        placeholder="Choose username" required>

      <label>Email</label>
      <input id="email" type="email"
        placeholder="Enter email" required>

      <label>Password</label>
      <input id="password" type="password"
        placeholder="Create password"
        minlength="6" required>

      <button type="submit">Create Account</button>

      <div id="message"></div>

    </form>

    <a class="back" href="index.html">← Back to Home</a>

  </div>

  <!-- Supabase library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase-config.js"></script>

  <script>

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    document
      .getElementById("signupForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();

        const username =
          document.getElementById("username").value.trim();

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        const message =
          document.getElementById("message");

        message.textContent =
          "Creating your account...";

        const { data, error } =
          await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {
              data: {
                username: username
              }
            }

          });

        if (error) {

  alert("SUPABASE ERROR: " + error.message);

  message.textContent =
    error.message;

  return;

}

        message.textContent =
          "Account created successfully!";

        document
          .getElementById("signupForm")
          .reset();

      });

  </script>

</body>
</html>
