<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Owino Live</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #09090f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 400px;
      background: #151520;
      padding: 30px;
      border-radius: 15px;
    }

    h1 {
      text-align: center;
      color: #ff3b81;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0 15px;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #333;
      background: #09090f;
      color: white;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #ff3b81;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>Owino Live</h1>

    <h2>Create Account</h2>

    <form id="signupForm">

      <label>Username</label>
      <input id="username" type="text" placeholder="Choose username" required>

      <label>Email</label>
      <input id="email" type="email" placeholder="Enter email" required>

      <label>Password</label>
      <input id="password" type="password" placeholder="Create password" required>

      <button type="submit">Create Account</button>

      <div id="message"></div>

    </form>

  </div>

  <script>
    const SUPABASE_URL = https://owtgzvvvnbmxtricerid.supabase.co/rest/v1/
    const SUPABASE_KEY = sb_publishable_8hOxB_sRLTTolDEZvrrZ_Q_PpBQntXN

    document.getElementById("signupForm").addEventListener("submit", async function(event) {

      event.preventDefault();

      const username = document.getElementById("username").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      message.textContent = "Creating your account...";

      try {

        const response = await fetch(
          SUPABASE_URL + "/auth/v1/signup",
          {
            method: "POST",
            headers: {
              "apikey": SUPABASE_KEY,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              email: email,
              password: password,
              data: {
                username: username
              }
            })
          }
        );

        const result = await response.json();

        if (!response.ok) {
          message.textContent = result.msg || result.message || "Signup failed.";
          return;
        }

        message.textContent = "Account created successfully!";

      } catch (error) {
        message.textContent = "Connection error. Please try again.";
      }

    });
  </script>

</body>
</html>
