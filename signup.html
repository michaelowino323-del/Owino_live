<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Owino Live</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #09090f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 400px;
      background: #151520;
      padding: 30px;
      border-radius: 15px;
    }

    h1 {
      text-align: center;
      color: #ff3b81;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0 15px;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #333;
      background: #09090f;
      color: white;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #ff3b81;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>Owino Live</h1>

    <h2>Create Account</h2>

    <form>
      <label>Username</label>
      <input type="text" placeholder="Choose username" required>

      <label>Email</label>
      <input type="email" placeholder="Enter email" required>

      <label>Password</label>
      <input type="password" placeholder="Create password" required>

      <button type="submit">Create Account</button>
    </form>

  </div>

</body>
</html>
